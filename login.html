<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Đăng nhập · Admin</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f4f4f5; font: 15px/1.5 'Segoe UI', system-ui, -apple-system, sans-serif; color: #18181b; }
form { width: 100%; max-width: 380px; background: #fff; border: 1px solid #e4e4e7; border-radius: 14px; padding: 32px; box-shadow: 0 8px 30px rgba(0,0,0,.05); }
h1 { margin: 0 0 4px; font-size: 22px; display: flex; align-items: center; gap: 10px; }
h1 i { width: 12px; height: 12px; border-radius: 50%; background: #ED3833; }
p { margin: 0 0 24px; color: #71717a; font-size: 14px; }
label { display: block; font-size: 13px; font-weight: 600; color: #52525b; margin-bottom: 6px; }
input { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid #e4e4e7; border-radius: 8px; margin-bottom: 16px; outline: none; }
input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
button { width: 100%; font: 600 15px inherit; font-family: inherit; padding: 12px; border: 0; border-radius: 8px; background: #18181b; color: #fff; cursor: pointer; margin-top: 4px; }
button:hover { background: #000; }
button:disabled { opacity: .6; cursor: default; }
.err { background: #fee2e2; color: #991b1b; padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
</style>
</head>
<body>
<form id="f">
  <h1><i></i> Đăng nhập</h1>
  <p>Trang quản trị nội dung landing page</p>
  <div class="err" id="err" hidden></div>
  <label for="u">Tên đăng nhập</label>
  <input id="u" autocomplete="username" required autofocus>
  <label for="p">Mật khẩu</label>
  <input id="p" type="password" autocomplete="current-password" required>
  <button id="b">Đăng nhập</button>
</form>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'), b = document.getElementById('b');
  err.hidden = true; b.disabled = true; b.textContent = 'Đang đăng nhập…';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'admin' },
      body: JSON.stringify({ username: document.getElementById('u').value.trim(), password: document.getElementById('p').value }),
    });
    if (res.ok) return location.replace('/admin');
    err.textContent = (await res.json()).error || 'Đăng nhập thất bại';
  } catch { err.textContent = 'Không kết nối được máy chủ'; }
  err.hidden = false; b.disabled = false; b.textContent = 'Đăng nhập';
};
</script>
</body>
</html>
