<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Chỉnh sửa landing</title>
<style>
:root { --bg: #f4f4f5; --panel: #fff; --line: #e4e4e7; --text: #18181b; --muted: #71717a; --accent: #ED3833; --blue: #2563eb; --green: #16a34a; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 14px/1.45 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--text); background: var(--bg); display: flex; flex-direction: column; }
button { font: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }

/* Top bar */
.top { height: 56px; flex: none; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 16px; }
.brand { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; margin-right: auto; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.devices { display: flex; background: var(--bg); border-radius: 8px; padding: 3px; }
.devices button { border: 0; background: none; padding: 6px 12px; border-radius: 6px; color: var(--muted); font-weight: 600; }
.devices button.on { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.status { font-size: 13px; color: var(--muted); min-width: 120px; text-align: right; }
.status.dirty { color: #b45309; font-weight: 600; }
.status.ok { color: var(--green); }
.tbtn { border: 1px solid var(--line); background: #fff; padding: 8px 14px; border-radius: 8px; font-weight: 600; color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.tbtn:hover { background: var(--bg); }
.tbtn:disabled { opacity: .45; cursor: default; }
.save { background: var(--text); color: #fff; border-color: var(--text); }
.save:hover { background: #000; }
.save.pulse { background: var(--accent); border-color: var(--accent); }

/* Layout */
.main { flex: 1; display: flex; min-height: 0; }
.side { width: 440px; flex: none; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 14px 80px; }
.tip { background: #eff6ff; color: #1e40af; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
.stage { flex: 1; min-width: 0; position: relative; overflow: hidden; display: flex; justify-content: center; padding: 16px; }
.frame-wrap { transform-origin: top center; background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,.08); border-radius: 8px; overflow: hidden; flex: none; }
iframe { border: 0; display: block; width: 100%; height: 100%; }

/* Sections */
.sec { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; background: #fff; }
.sec-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; user-select: none; }
.sec-h b { flex: 1; font-size: 14px; }
.sec-h small { color: var(--muted); font-weight: 400; display: block; font-size: 12px; }
.sec-h .chev { transition: transform .2s; color: var(--muted); }
.sec.open .sec-h .chev { transform: rotate(90deg); }
.sec-h .badge { font-size: 11px; background: #fef3c7; color: #92400e; padding: 2px 8px; border-radius: 99px; }
.sec-b { display: none; padding: 4px 14px 16px; border-top: 1px solid var(--line); }
.sec.open .sec-b { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Fields */
.fld { grid-column: span 2; display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
.fld.half { grid-column: span 1; }
.fld > span { font-size: 12px; font-weight: 600; color: var(--muted); }
.fld input[type=text], .fld textarea { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; background: #fff; outline: none; transition: border-color .15s, box-shadow .15s; }
.fld textarea { resize: vertical; min-height: 64px; }
.fld input:focus, .fld textarea:focus, .flash { border-color: var(--blue) !important; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
.color { display: flex; gap: 6px; }
.color input[type=color] { width: 40px; height: 36px; padding: 2px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
.switch { grid-column: span 2; display: flex; align-items: center; gap: 8px; margin-top: 10px; font-weight: 600; cursor: pointer; }
.switch input { width: 16px; height: 16px; accent-color: var(--green); }

.img-box { position: relative; height: 140px; border: 1.5px dashed var(--line); border-radius: 8px; background: #fafafa center/contain no-repeat; display: flex; align-items: flex-end; justify-content: center; padding: 10px; transition: border-color .15s, background-color .15s; }
.img-box.drag { border-color: var(--blue); background-color: #eff6ff; }
.img-box .up { border: 0; background: rgba(24,24,27,.85); color: #fff; padding: 7px 12px; border-radius: 7px; font-weight: 600; font-size: 13px; }
.img-box .up:hover { background: #000; }
.img-box.loading::after { content: "Đang tải ảnh…"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255,255,255,.85); font-weight: 600; border-radius: 8px; }
.img-hint { font-size: 11px; color: var(--muted); }
.fld input.url { font-size: 12px; color: var(--muted); }

.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.icons button { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 7px; background: #fff; padding: 7px; color: var(--muted); }
.icons button svg { width: 100%; height: 100%; }
.icons button.on { border-color: var(--accent); color: var(--accent); background: #fff5f5; }

/* Lists */
.list { grid-column: span 2; margin-top: 10px; }
.list > span { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 6px; }
.item { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; background: #fcfcfc; }
.item-h { display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 10px; cursor: pointer; }
.item-h .n { width: 22px; height: 22px; border-radius: 6px; background: var(--bg); display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
.item-h .sum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.tools { display: flex; gap: 2px; flex: none; }
.tools button { width: 26px; height: 26px; border: 0; background: none; border-radius: 6px; color: var(--muted); font-size: 13px; }
.tools button:hover { background: var(--bg); color: var(--text); }
.tools button.del:hover { background: #fee2e2; color: #b91c1c; }
.item-b { display: none; padding: 0 10px 12px; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.item.open > .item-b { display: grid; }
.item.inline { display: flex; align-items: center; gap: 6px; padding: 5px 6px; background: #fff; }
.item.inline .row { flex: 1; display: flex; gap: 6px; min-width: 0; }
.item.inline input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; outline: none; }
.item.inline input:focus { border-color: var(--blue); }
.add { width: 100%; border: 1.5px dashed var(--line); background: none; border-radius: 8px; padding: 8px; color: var(--muted); font-weight: 600; }
.add:hover { border-color: var(--text); color: var(--text); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 20px); background: var(--text); color: #fff; padding: 10px 18px; border-radius: 8px; font-weight: 600; opacity: 0; transition: all .25s; pointer-events: none; z-index: 99; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: #b91c1c; }

.count { background: var(--accent); color: #fff; border-radius: 99px; font-size: 11px; padding: 1px 7px; font-weight: 700; }
.dialog.wide { max-width: 640px; }
.lead-filter { display: flex; gap: 16px; margin: 14px 0 12px; font-weight: 600; }
.lead-filter label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.lead { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.lead.done { background: #fafafa; opacity: .7; }
.lead-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.lead-top b { font-size: 15px; }
.lead-top time { color: var(--muted); font-size: 12px; white-space: nowrap; }
.lead-phone { display: inline-block; margin-top: 2px; font-weight: 700; color: var(--blue); text-decoration: none; }
.lead p { margin: 6px 0 0; white-space: pre-wrap; font-size: 13px; }
.lead small { color: var(--muted); }
.lead-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.lead-actions label { display: flex; gap: 6px; align-items: center; font-weight: 600; cursor: pointer; font-size: 13px; }
.empty { text-align: center; color: var(--muted); padding: 28px 0; }
.reset { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line); display: grid; gap: 6px; }
.reset small { color: var(--muted); font-size: 12px; }

/* Tài khoản */
[hidden] { display: none !important; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: grid; place-items: center; z-index: 90; padding: 16px; }
.dialog { background: #fff; border-radius: 14px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; padding: 20px 22px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.dialog-h { display: flex; justify-content: space-between; align-items: center; font-size: 17px; }
.x { border: 0; background: none; font-size: 16px; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; }
.x:hover { background: var(--bg); }
.dialog h4 { margin: 20px 0 10px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.form { display: grid; gap: 8px; }
.form.row { grid-template-columns: 1fr 1fr auto; margin-top: 8px; }
.form input { border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; outline: none; min-width: 0; }
.form input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
.form .save { justify-content: center; }
.users { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; }
.users li { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.users li:last-child { border-bottom: 0; }
.users em { color: var(--muted); font-style: normal; font-size: 12px; }
.tbtn.sm { padding: 4px 10px; font-size: 12px; }
.tbtn.confirm { background: #fee2e2; border-color: #fecaca; color: #b91c1c; }
.logout { width: 100%; justify-content: center; margin-top: 22px; color: #b91c1c; }
@media (max-width: 480px) { .form.row { grid-template-columns: 1fr; } }

@media (max-width: 900px) {
  .main { flex-direction: column; }
  .side { width: 100%; height: 50%; border-right: 0; border-bottom: 1px solid var(--line); }
  .devices, .status { display: none; }
}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><i></i> Admin landing</div>
  <div class="devices">
    <button data-device="1440" class="on">🖥 Desktop</button>
    <button data-device="834">Tablet</button>
    <button data-device="390">📱 Mobile</button>
  </div>
  <span class="status" id="status">Đang tải…</span>
  <button class="tbtn" id="undo" title="Hoàn tác (Ctrl+Z khi không gõ chữ)" disabled>↶ Hoàn tác</button>
  <a class="tbtn" href="/" target="_blank">Xem trang thật ↗</a>
  <button class="tbtn save" id="save" title="Ctrl+S">💾 Lưu</button>
  <button class="tbtn" id="leadsBtn" title="Khách để lại thông tin">📥 Khách <span class="count" id="leadCount" hidden></span></button>
  <button class="tbtn" id="userBtn" title="Tài khoản">👤</button>
</div>
<div class="modal" id="account" hidden>
  <div class="dialog">
    <div class="dialog-h"><b>Tài khoản</b><button class="x" data-close>✕</button></div>
    <h4>Đổi mật khẩu của bạn</h4>
    <form id="changePw" class="form">
      <input type="password" name="current" placeholder="Mật khẩu hiện tại" autocomplete="current-password" required>
      <input type="password" name="next" placeholder="Mật khẩu mới (tối thiểu 8 ký tự)" autocomplete="new-password" minlength="8" required>
      <input type="password" name="confirm" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" minlength="8" required>
      <button class="tbtn save">Đổi mật khẩu</button>
    </form>
    <h4>Danh sách admin</h4>
    <ul class="users" id="users"></ul>
    <form id="addUser" class="form row">
      <input name="username" placeholder="Tên đăng nhập mới" autocomplete="off" required pattern="[a-zA-Z0-9._\-]{3,32}" title="3–32 ký tự: chữ không dấu, số, . _ -">
      <input type="password" name="password" placeholder="Mật khẩu" autocomplete="new-password" minlength="8" required>
      <button class="tbtn">+ Thêm</button>
    </form>
    <button class="tbtn logout" id="logout">Đăng xuất</button>
  </div>
</div>
<div class="main">
  <aside class="side" id="side"></aside>
  <div class="stage" id="stage"><div class="frame-wrap" id="wrap"><iframe id="preview" title="Preview"></iframe></div></div>
</div>
<div class="modal" id="leads" hidden>
  <div class="dialog wide">
    <div class="dialog-h"><b>Khách để lại thông tin</b><button class="x" data-close>✕</button></div>
    <div class="lead-filter">
      <label><input type="radio" name="lf" value="new" checked> Chưa liên hệ</label>
      <label><input type="radio" name="lf" value="all"> Tất cả</label>
    </div>
    <div id="leadList"></div>
  </div>
</div>
<datalist id="links">
  <option value="#bao-gia">Mở popup báo giá</option>
  <option value="#hero">Banner đầu trang</option>
  <option value="#usp">Điểm mạnh & số liệu</option>
  <option value="#industries">Ngành ứng dụng</option>
  <option value="#capabilities">Năng lực</option>
  <option value="#banner">Banner catalogue</option>
  <option value="#faq">Câu hỏi thường gặp</option>
  <option value="#footer">Chân trang</option>
</datalist>
<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script>
/* ================= SCHEMA: mô tả các ô nhập cho từng section =================
   Kiểu: text | textarea | image | color | icon | toggle | list
   Muốn thêm ô mới: thêm field vào đây + dùng nó trong index.html */
const link = (k, label, hrefKey = k.replace(/Label$|Button$/, '') + 'Href') => [
  { k, t: 'text', label, half: true },
  { k: hrefKey, t: 'text', label: 'Link khi bấm', half: true, ph: '#bao-gia = mở popup báo giá', link: true },
];
const SHOW = { k: 'hidden', t: 'toggle' };
const SCHEMA = [
  { key: 'theme', title: 'Màu sắc', hint: 'Màu chủ đạo của cả trang', fields: [
    { k: 'accent', t: 'color', label: 'Màu nhấn (nút, icon)', half: true },
    { k: 'text', t: 'color', label: 'Màu tiêu đề', half: true },
    { k: 'muted', t: 'color', label: 'Màu chữ thường', half: true },
    { k: 'soft', t: 'color', label: 'Màu nền xám nhạt', half: true },
  ]},
  { key: 'seo', title: 'SEO / Google', hint: 'Tiêu đề tab & mô tả khi tìm kiếm', fields: [
    { k: 'title', t: 'text', label: 'Tiêu đề trang' },
    { k: 'description', t: 'textarea', label: 'Mô tả ngắn' },
  ]},
  { key: 'header', title: 'Menu đầu trang', hint: 'Logo, menu, nút liên hệ', fields: [
    { k: 'logo', t: 'image', label: 'Logo' },
    { k: 'nav', t: 'list', label: 'Các mục menu', inline: true, item: [
      { k: 'label', t: 'text', ph: 'Tên mục' }, { k: 'href', t: 'text', ph: 'Link', link: true } ] },
    ...link('ctaLabel', 'Chữ nút bên phải', 'ctaHref'),
  ]},
  { key: 'hero', title: 'Banner chính (Hero)', hint: 'Ảnh lớn đầu trang', fields: [
    SHOW,
    { k: 'image', t: 'image', label: 'Ảnh nền' },
    { k: 'title', t: 'textarea', label: 'Tiêu đề lớn (Enter = xuống dòng)' },
    { k: 'subtitle', t: 'textarea', label: 'Mô tả phụ (bỏ trống = ẩn)' },
    ...link('buttonLabel', 'Chữ trên nút'),
  ]},
  { key: 'usp', title: 'Điểm mạnh & số liệu', hint: '3 thẻ ưu điểm + dải con số', fields: [
    SHOW,
    { k: 'title', t: 'textarea', label: 'Tiêu đề section' },
    ...link('buttonLabel', 'Chữ trên nút'),
    { k: 'items', t: 'list', label: 'Thẻ ưu điểm', name: 'thẻ', item: [
      { k: 'icon', t: 'icon', label: 'Icon' },
      { k: 'title', t: 'text', label: 'Tiêu đề' },
      { k: 'text', t: 'textarea', label: 'Mô tả' } ] },
    { k: 'stats', t: 'list', label: 'Con số (số · đơn vị · nhãn)', name: 'con số', inline: true, item: [
      { k: 'value', t: 'text', ph: '8000' }, { k: 'unit', t: 'text', ph: 'TPA' }, { k: 'label', t: 'text', ph: 'Nhãn' } ] },
  ]},
  { key: 'industries', title: 'Ngành ứng dụng (Tabs)', hint: 'Mỗi tab một ngành', fields: [
    SHOW,
    { k: 'title', t: 'textarea', label: 'Tiêu đề section' },
    { k: 'tabs', t: 'list', label: 'Các tab', name: 'tab', item: [
      { k: 'name', t: 'text', label: 'Tên tab' },
      { k: 'image', t: 'image', label: 'Ảnh' },
      { k: 'heading', t: 'textarea', label: 'Tiêu đề' },
      { k: 'text', t: 'textarea', label: 'Mô tả' },
      { k: 'features', t: 'list', label: 'Gạch đầu dòng', name: 'dòng', inline: true, item: [{ k: 'text', t: 'text', ph: 'Nội dung' }] },
      { k: 'products', t: 'text', label: 'Tên sản phẩm' },
      ...link('button1', 'Nút 1'),
      ...link('button2', 'Nút 2'),
    ]},
  ]},
  { key: 'capabilities', title: 'Năng lực', hint: '4 thẻ + ảnh nhà máy', fields: [
    SHOW,
    { k: 'title', t: 'textarea', label: 'Tiêu đề section' },
    { k: 'image', t: 'image', label: 'Ảnh bên phải' },
    { k: 'cards', t: 'list', label: 'Thẻ năng lực', name: 'thẻ', item: [
      { k: 'icon', t: 'icon', label: 'Icon' },
      { k: 'title', t: 'text', label: 'Tiêu đề' },
      { k: 'text', t: 'textarea', label: 'Mô tả' },
      ...link('linkLabel', 'Chữ link', 'href') ] },
  ]},
  { key: 'quote', title: 'Popup báo giá', hint: 'Hiện khi bấm nút có link #bao-gia', fields: [
    { k: 'title', t: 'text', label: 'Tiêu đề popup' },
    { k: 'text', t: 'textarea', label: 'Mô tả' },
    { k: 'phone', t: 'text', label: 'Số điện thoại (bỏ trống = ẩn nút gọi)', half: true, ph: '0386 192 866' },
    { k: 'callLabel', t: 'text', label: 'Chữ trước số', half: true, ph: 'Gọi' },
    { k: 'zalo', t: 'text', label: 'Số Zalo (bỏ trống = ẩn nút Zalo)', half: true, ph: '0386192866' },
    { k: 'zaloLabel', t: 'text', label: 'Chữ nút Zalo', half: true, ph: 'Chat Zalo' },
    { k: 'showForm', t: 'check', label: 'Hiện form để khách điền thông tin' },
    { k: 'orText', t: 'text', label: 'Dòng ngăn cách' },
    { k: 'needPlaceholder', t: 'text', label: 'Gợi ý trong ô Nhu cầu' },
    { k: 'buttonLabel', t: 'text', label: 'Chữ nút gửi' },
    { k: 'successTitle', t: 'text', label: 'Tiêu đề sau khi gửi' },
    { k: 'successText', t: 'textarea', label: 'Lời nhắn sau khi gửi' },
  ]},
  { key: 'banner', title: 'Banner tải catalogue', hint: 'Khối nền tối có nút đỏ', fields: [
    SHOW,
    { k: 'title', t: 'text', label: 'Tiêu đề' },
    { k: 'text', t: 'textarea', label: 'Mô tả' },
    ...link('buttonLabel', 'Chữ trên nút'),
  ]},
  { key: 'faq', title: 'Câu hỏi thường gặp', hint: 'Hỏi – đáp dạng xổ xuống', fields: [
    SHOW,
    { k: 'title', t: 'text', label: 'Tiêu đề section' },
    { k: 'items', t: 'list', label: 'Câu hỏi', name: 'câu hỏi', item: [
      { k: 'q', t: 'text', label: 'Câu hỏi' }, { k: 'a', t: 'textarea', label: 'Trả lời' } ] },
  ]},
  { key: 'footer', title: 'Chân trang', hint: 'Địa chỉ, liên hệ, cột link', fields: [
    { k: 'ctaTitle', t: 'text', label: 'Tiêu đề khối kêu gọi (bỏ trống = ẩn)' },
    { k: 'ctaText', t: 'textarea', label: 'Mô tả khối kêu gọi' },
    ...link('ctaButton', 'Chữ trên nút', 'ctaHref'),
    { k: 'logo', t: 'image', label: 'Logo chân trang' },
    { k: 'addresses', t: 'list', label: 'Địa chỉ', name: 'địa chỉ', item: [
      { k: 'title', t: 'text', label: 'Tên (VD: Văn phòng)' }, { k: 'lines', t: 'textarea', label: 'Địa chỉ (Enter = xuống dòng)' } ] },
    { k: 'email', t: 'text', label: 'Email', half: true },
    { k: 'phone', t: 'text', label: 'Số điện thoại', half: true },
    { k: 'columns', t: 'list', label: 'Cột link', name: 'cột', item: [
      { k: 'title', t: 'text', label: 'Tiêu đề cột' },
      { k: 'links', t: 'list', label: 'Các link', name: 'link', inline: true, item: [
        { k: 'label', t: 'text', ph: 'Chữ' }, { k: 'href', t: 'text', ph: 'Link', link: true } ] } ] },
    { k: 'copyright', t: 'text', label: 'Dòng bản quyền' },
  ]},
];

/* ================= STATE ================= */
let content, saved, snap, typing = null;
const history = [];
const openSecs = new Set(['hero']);
const openItems = new Set();
const $ = (s) => document.querySelector(s);
const side = $('#side'), frame = $('#preview');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const get = (path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), content);
function set(path, val) {
  const keys = path.split('.'), last = keys.pop();
  const obj = keys.reduce((o, k) => (o[k] ??= /^\d+$/.test(k) ? [] : {}), content);
  obj[last] = val;
}
const findField = (path) => {
  // Tìm định nghĩa field theo path, VD "industries.tabs.0.features"
  const [sec, ...rest] = path.split('.');
  let fields = SCHEMA.find((s) => s.key === sec)?.fields, f = null;
  for (const k of rest) { if (/^\d+$/.test(k)) { fields = f.item; continue; } f = fields?.find((x) => x.k === k); }
  return f;
};

/* ================= RENDER FORM ================= */
function renderForm() {
  const top = side.scrollTop;
  side.innerHTML = `<div class="tip">💡 <b>Bấm thẳng vào chữ hoặc ảnh bên phải</b> để nhảy tới ô cần sửa. Kéo-thả ảnh vào khung ảnh để thay.</div>` +
    SCHEMA.map((s) => {
      const hidden = content[s.key]?.hidden;
      return `<div class="sec ${openSecs.has(s.key) ? 'open' : ''}" data-sec="${s.key}">
        <div class="sec-h" data-open="${s.key}"><span class="chev">▶</span><b>${s.title}<small>${s.hint}</small></b>${hidden ? '<span class="badge">Đang ẩn</span>' : ''}</div>
        <div class="sec-b">${s.fields.map((f) => field(f, s.key)).join('')}</div>
      </div>`;
    }).join('') +
    `<div class="reset"><button type="button" class="tbtn" data-reset="1">↺ Nạp nội dung mặc định</button>
      <small>Thay toàn bộ nội dung đang sửa bằng bản mặc định trong <code>content.json</code>. Chỉ áp dụng lên web khi bấm Lưu; bấm Hoàn tác nếu nhầm.</small></div>`;
  side.scrollTop = top;
}

function field(f, base) {
  const p = `${base}.${f.k}`, v = get(p), cls = `fld ${f.half ? 'half' : ''}`;
  const label = f.label ? `<span>${f.label}</span>` : '';
  switch (f.t) {
    case 'text': return `<label class="${cls}">${label}<input type="text" data-path="${p}" value="${esc(v)}" placeholder="${esc(f.ph || '')}"${f.link ? ' list="links"' : ''}></label>`;
    case 'check': return `<label class="switch"><input type="checkbox" data-path="${p}" ${v === false ? '' : 'checked'}> ${f.label}</label>`;
    case 'textarea': return `<label class="${cls}">${label}<textarea data-path="${p}" rows="${Math.min(8, Math.max(2, String(v || '').split('\n').length + 1))}">${esc(v)}</textarea></label>`;
    case 'color': return `<div class="${cls}">${label}<div class="color"><input type="color" data-path="${p}" value="${esc(v)}"><input type="text" data-path="${p}" value="${esc(v)}"></div></div>`;
    case 'toggle': return `<label class="switch"><input type="checkbox" data-path="${p}" data-invert ${v ? '' : 'checked'}> Hiển thị section này trên trang</label>`;
    case 'image': return `<div class="${cls}">${label}
        <div class="img-box" data-drop="${p}" style="background-image:url('${esc(v)}')"><button class="up" data-upload="${p}">📷 Đổi ảnh</button></div>
        <input type="text" class="url" data-path="${p}" value="${esc(v)}" placeholder="…hoặc dán link ảnh vào đây">
        <span class="img-hint">Kéo-thả file ảnh vào khung, hoặc bấm “Đổi ảnh”. JPG/PNG/WebP/SVG.</span></div>`;
    case 'icon': return `<div class="${cls}">${label}<div class="icons">${Object.keys(icons()).filter((n) => !['arrow', 'check', 'menu'].includes(n))
        .map((n) => `<button type="button" data-icon="${n}" data-path-icon="${p}" class="${v === n ? 'on' : ''}" title="${n}"><svg viewBox="0 0 24 24">${icons()[n]}</svg></button>`).join('')}</div></div>`;
    case 'list': return `<div class="list" data-list="${p}">${label}${(v || []).map((it, i) => item(f, `${p}.${i}`, it, i, v.length)).join('')}
        <button type="button" class="add" data-add="${p}">+ Thêm ${f.name || 'mục'}</button></div>`;
  }
  return '';
}

function item(f, p, it, i, n) {
  const tools = `<div class="tools">
    <button type="button" data-move="${p}" data-dir="-1" title="Lên" ${i === 0 ? 'disabled' : ''}>↑</button>
    <button type="button" data-move="${p}" data-dir="1" title="Xuống" ${i === n - 1 ? 'disabled' : ''}>↓</button>
    <button type="button" data-dup="${p}" title="Nhân bản">⧉</button>
    <button type="button" class="del" data-del="${p}" title="Xoá">✕</button></div>`;
  if (f.inline) return `<div class="item inline"><div class="row">${f.item.map((sf) =>
    `<input type="text" data-path="${p}.${sf.k}" value="${esc(it[sf.k])}" placeholder="${esc(sf.ph || '')}"${sf.link ? ' list="links"' : ''}>`).join('')}</div>${tools}</div>`;
  return `<div class="item ${openItems.has(p) ? 'open' : ''}" data-item="${p}">
    <div class="item-h" data-toggle="${p}"><span class="n">${i + 1}</span><span class="sum">${esc(summary(f, it) || `(${f.name || 'mục'} trống)`)}</span>${tools}</div>
    <div class="item-b">${f.item.map((sf) => field(sf, p)).join('')}</div></div>`;
}
const summary = (f, it) => { const k = f.item.find((x) => x.t === 'text' || x.t === 'textarea')?.k; return k ? String(it[k] || '').split('\n')[0] : ''; };
const icons = () => frame.contentWindow?.ICONS || {};

/* ================= PREVIEW ================= */
let raf = 0;
function sendPreview() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => frame.contentWindow?.postMessage({ type: 'content', content }, location.origin));
}
window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  if (e.data?.type === 'ready') { sendPreview(); renderForm(); /* vẽ lại để có icon */ }
  if (e.data?.type === 'select') selectPath(e.data.path);
});

// Từ preview -> mở đúng ô bên admin
function selectPath(path) {
  const parts = path.split('.');
  openSecs.add(parts[0]);
  for (let i = 1; i < parts.length; i++) if (/^\d+$/.test(parts[i])) openItems.add(parts.slice(0, i + 1).join('.'));
  renderForm();
  const el = side.querySelector(`[data-path="${CSS.escape(path)}"]`) || side.querySelector(`[data-drop="${CSS.escape(path)}"]`)
    || side.querySelector(`[data-path-icon="${CSS.escape(path)}"]`)?.parentElement;
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  if (el.matches('input, textarea')) el.focus({ preventScroll: true });
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1200);
}

/* Thu phóng preview cho vừa khung theo thiết bị */
let device = 1440;
function fit() {
  const stage = $('#stage'), wrap = $('#wrap');
  const availW = stage.clientWidth - 32, availH = stage.clientHeight - 32;
  const scale = Math.min(1, availW / device);
  wrap.style.width = device + 'px';
  wrap.style.height = availH / scale + 'px';
  wrap.style.transform = `scale(${scale})`;
}
new ResizeObserver(fit).observe($('#stage'));
document.querySelectorAll('[data-device]').forEach((b) => b.onclick = () => {
  document.querySelectorAll('[data-device]').forEach((x) => x.classList.toggle('on', x === b));
  device = +b.dataset.device; fit();
});

/* ================= CHANGE TRACKING / UNDO ================= */
function changed() {
  const dirty = JSON.stringify(content) !== saved;
  const st = $('#status');
  st.textContent = dirty ? '● Chưa lưu' : '✓ Đã lưu';
  st.className = 'status ' + (dirty ? 'dirty' : 'ok');
  $('#save').classList.toggle('pulse', dirty);
  $('#undo').disabled = !history.length && !typing;
  sendPreview();
}
function flushTyping() { if (typing) { clearTimeout(typing); typing = null; snap = JSON.stringify(content); } }
function structural(fn) { flushTyping(); history.push(snap); fn(); snap = JSON.stringify(content); renderForm(); changed(); }
function typed() {
  if (!typing) { history.push(snap); if (history.length > 100) history.shift(); }
  clearTimeout(typing);
  typing = setTimeout(() => { typing = null; snap = JSON.stringify(content); }, 700);
  changed();
}
function undo() {
  flushTyping();
  if (!history.length) return;
  content = JSON.parse(history.pop()); snap = JSON.stringify(content);
  renderForm(); changed(); toast('Đã hoàn tác');
}

/* ================= EVENTS ================= */
side.addEventListener('input', (e) => {
  const el = e.target, p = el.dataset.path;
  if (!p) return;
  const val = el.type === 'checkbox' ? (el.hasAttribute('data-invert') ? !el.checked : el.checked) : el.value;
  set(p, val);
  // Đồng bộ các ô cùng path (ô màu + mã màu, ảnh + link ảnh)
  side.querySelectorAll(`[data-path="${CSS.escape(p)}"]`).forEach((o) => { if (o !== el && o.type !== 'checkbox') o.value = val; });
  const box = side.querySelector(`[data-drop="${CSS.escape(p)}"]`);
  if (box) box.style.backgroundImage = `url('${val}')`;
  const itemEl = el.closest('.item[data-item]');
  if (itemEl) { const f = findField(itemEl.dataset.item.replace(/\.\d+$/, '')); itemEl.querySelector(':scope > .item-h .sum').textContent = summary(f, get(itemEl.dataset.item)) || '(trống)'; }
  if (el.type === 'checkbox') { structuralRefresh(); return; }
  typed();
});
function structuralRefresh() { history.push(snap); snap = JSON.stringify(content); renderForm(); changed(); }

side.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-open], [data-toggle]');
  if (!t) return;
  const d = t.dataset;
  if (d.open) {
    openSecs.has(d.open) ? openSecs.delete(d.open) : openSecs.add(d.open);
    t.parentElement.classList.toggle('open');
    if (openSecs.has(d.open)) frame.contentWindow?.postMessage({ type: 'focus', path: d.open }, location.origin);
  } else if (d.toggle && !e.target.closest('.tools')) {
    openItems.has(d.toggle) ? openItems.delete(d.toggle) : openItems.add(d.toggle);
    t.parentElement.classList.toggle('open');
    frame.contentWindow?.postMessage({ type: 'focus', path: d.toggle }, location.origin);
  } else if (d.add) {
    const f = findField(d.add);
    structural(() => { const arr = get(d.add) || []; arr.push(blank(f.item)); set(d.add, arr); openItems.add(`${d.add}.${arr.length - 1}`); });
  } else if (d.del || d.dup || d.move) {
    const p = d.del || d.dup || d.move, listPath = p.replace(/\.\d+$/, ''), i = +p.split('.').pop();
    structural(() => {
      const arr = get(listPath);
      if (d.del) arr.splice(i, 1);
      if (d.dup) { arr.splice(i + 1, 0, structuredClone(arr[i])); openItems.add(`${listPath}.${i + 1}`); }
      if (d.move) { const j = i + +d.dir; if (j >= 0 && j < arr.length) [arr[i], arr[j]] = [arr[j], arr[i]]; }
      [...openItems].filter((x) => x.startsWith(listPath + '.')).forEach((x) => openItems.delete(x));
    });
    toast(d.del ? 'Đã xoá — bấm Hoàn tác nếu nhầm' : d.dup ? 'Đã nhân bản' : 'Đã đổi thứ tự');
  } else if (d.upload) {
    e.preventDefault(); pickFile(d.upload);
  } else if (d.icon) {
    structural(() => set(d.pathIcon, d.icon));
  } else if (d.reset) {
    // Bấm 2 lần để xác nhận
    if (!t.classList.contains('confirm')) { t.classList.add('confirm'); t.textContent = 'Bấm lần nữa để thay toàn bộ nội dung'; return; }
    api('GET', '/api/default-content')
      .then((def) => { structural(() => { content = def; }); toast('Đã nạp nội dung mặc định — xem preview rồi bấm Lưu'); })
      .catch((err) => toast('Không nạp được: ' + err.message, true));
  }
});
const blank = (fields) => Object.fromEntries(fields.map((f) => [f.k, f.t === 'list' ? [] : f.t === 'icon' ? 'star' : '']));

side.addEventListener('focusin', (e) => {
  const p = e.target.dataset?.path;
  if (p) frame.contentWindow?.postMessage({ type: 'focus', path: p }, location.origin);
});

/* ================= UPLOAD ẢNH ================= */
let uploadTarget = null;
function pickFile(path) { uploadTarget = path; $('#file').value = ''; $('#file').click(); }
$('#file').onchange = (e) => e.target.files[0] && uploadImage(uploadTarget, e.target.files[0]);
side.addEventListener('dragover', (e) => { const b = e.target.closest('[data-drop]'); if (b) { e.preventDefault(); b.classList.add('drag'); } });
side.addEventListener('dragleave', (e) => e.target.closest('[data-drop]')?.classList.remove('drag'));
side.addEventListener('drop', (e) => {
  const b = e.target.closest('[data-drop]');
  if (!b) return;
  e.preventDefault(); b.classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (file) uploadImage(b.dataset.drop, file);
});
/* ================= GỌI API ================= */
async function api(method, url, body, headers = {}) {
  const isJson = body !== undefined && !(body instanceof Blob);
  const res = await fetch(url, {
    method,
    headers: { 'X-Requested-With': 'admin', ...(isJson ? { 'Content-Type': 'application/json' } : {}), ...headers },
    body: isJson ? JSON.stringify(body) : body,
  });
  const out = await res.json().catch(() => ({}));
  if (res.status === 401) {
    showLoginExpired();
    throw new Error('Phiên đăng nhập đã hết hạn');
  }
  if (!res.ok) throw new Error(out.error || `Lỗi ${res.status}`);
  return out;
}
function showLoginExpired() {
  toast('Phiên đăng nhập hết hạn — mở tab mới để đăng nhập, rồi quay lại bấm Lưu (nội dung đang sửa vẫn còn)', true);
  window.open('/login', '_blank');
}

/* ================= UPLOAD ẢNH (lưu vào database) ================= */
async function uploadImage(path, file) {
  if (!file.type.startsWith('image/')) return toast('File này không phải ảnh', true);
  if (file.size > 15 * 1024 * 1024) return toast('Ảnh quá lớn (tối đa 15MB)', true);
  const box = side.querySelector(`[data-drop="${CSS.escape(path)}"]`);
  box?.classList.add('loading');
  try {
    const out = await api('POST', '/api/upload', file, { 'Content-Type': file.type, 'X-Filename': encodeURIComponent(file.name) });
    structural(() => set(path, out.url));
    toast('Đã thay ảnh — nhớ bấm Lưu');
  } catch (err) {
    box?.classList.remove('loading');
    toast('Tải ảnh thất bại: ' + err.message, true);
  }
}

/* ================= LƯU ================= */
async function save() {
  flushTyping();
  const btn = $('#save');
  btn.disabled = true;
  try {
    await api('PUT', '/api/content', content);
    saved = JSON.stringify(content); changed(); toast('✓ Đã lưu! Trang thật đã cập nhật.');
  } catch (err) { toast('Lưu thất bại: ' + err.message, true); }
  btn.disabled = false;
}
$('#save').onclick = save;
$('#undo').onclick = undo;
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.target.matches('input, textarea')) { e.preventDefault(); undo(); }
  if (e.key === 'Escape') closeAccount();
});
window.addEventListener('beforeunload', (e) => { if (content && JSON.stringify(content) !== saved) { e.preventDefault(); e.returnValue = ''; } });

let toastT;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', err ? 5000 : 2600);
}

/* ================= TÀI KHOẢN ================= */
let me = null;
const modal = $('#account');
function closeAccount() { modal.hidden = true; }
$('#userBtn').onclick = () => { modal.hidden = false; loadUsers(); };
modal.addEventListener('click', (e) => { if (e.target === modal || e.target.closest('[data-close]')) closeAccount(); });

}
$('#users').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-deluser]');

  // Bấm 2 lần để xác nhận xoá

$('#addUser').onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target;

    await api('POST', '/api/users', { username: f.username.value.trim(), password: f.password.value });

  } catch (err) { toast(err.message, true); }
};
$('#changePw').onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.next.value !== f.confirm.value) return toast('Mật khẩu nhập lại không khớp', true);
  try {
    await api('POST', '/api/password', { current: f.current.value, next: f.next.value });
    toast('✓ Đã đổi mật khẩu. Các thiết bị khác đã bị đăng xuất.'); f.reset();
  } catch (err) { toast(err.message, true); }
};
$('#logout').onclick = async () => {
  if (JSON.stringify(content) !== saved && !$('#logout').classList.contains('confirm')) {
    $('#logout').classList.add('confirm'); $('#logout').textContent = 'Còn thay đổi chưa lưu — bấm lần nữa để thoát';
    return;
  }
  await api('POST', '/api/logout').catch(() => {});
  saved = JSON.stringify(content);
  location.replace('/login');
};

/* ================= KHÁCH ĐỂ LẠI THÔNG TIN ================= */
const leadsModal = $('#leads');
let leads = [];
const fmtTime = (s) => new Date(s).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' });

async function loadLeads() {
  // Gọi thẳng fetch: chạy ngầm nên không bật thông báo hết phiên
  try {
    const res = await fetch('/api/leads', { headers: { 'X-Requested-With': 'admin' } });
    if (!res.ok) return;
    leads = await res.json();
  } catch { return; }
  const n = leads.filter((l) => !l.done).length;
  $('#leadCount').textContent = n; $('#leadCount').hidden = !n;
  if (!leadsModal.hidden) renderLeads();
}
function renderLeads() {
  const showAll = document.querySelector('input[name=lf]:checked').value === 'all';
  const list = leads.filter((l) => showAll || !l.done);
  $('#leadList').innerHTML = list.length ? list.map((l) => `
    <div class="lead ${l.done ? 'done' : ''}">
      <div class="lead-top"><b>${esc(l.name)}</b><time>${fmtTime(l.created_at)}</time></div>
      <a class="lead-phone" href="tel:${esc(l.phone.replace(/[^\d+]/g, ''))}">📞 ${esc(l.phone)}</a>
      ${l.company ? `<p>🏢 ${esc(l.company)}</p>` : ''}

        <button class="tbtn sm" data-dellead="${l.id}">Xoá</button>
      </div>
    </div>`).join('') : `<div class="empty">${showAll ? 'Chưa có khách nào để lại thông tin.' : '🎉 Không còn khách nào chờ liên hệ.'}</div>`;
}
$('#leadsBtn').onclick = () => { leadsModal.hidden = false; renderLeads(); loadLeads(); };
leadsModal.addEventListener('click', (e) => { if (e.target === leadsModal || e.target.closest('[data-close]')) leadsModal.hidden = true; });
leadsModal.addEventListener('change', async (e) => {
  if (e.target.name === 'lf') return renderLeads();

$('#leadList').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-dellead]');
  if (!b) return;
  if (!b.classList.contains('confirm')) { b.classList.add('confirm'); b.textContent = 'Chắc chắn xoá?'; return; }
  try { await api('DELETE', `/api/leads/${b.dataset.dellead}`); await loadLeads(); renderLeads(); toast('Đã xoá'); }
  catch (err) { toast(err.message, true); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') leadsModal.hidden = true; });

/* ================= KHỞI ĐỘNG ================= */
(async () => {
  try {
    [me, content] = await Promise.all([api('GET', '/api/me'), api('GET', '/api/content')]);
  } catch (err) {
    side.innerHTML = `<div class="tip" style="background:#fee2e2;color:#991b1b">Không tải được dữ liệu: ${esc(err.message)}. <a href="/login">Đăng nhập lại</a></div>`;
    return;
  }
  $('#userBtn').textContent = '👤 ' + me.username;
  loadLeads(); setInterval(loadLeads, 60000); // kiểm tra khách mới mỗi phút
  saved = snap = JSON.stringify(content);
  renderForm(); changed();
  frame.src = '/?preview=1';
})();
</script>
</body>
